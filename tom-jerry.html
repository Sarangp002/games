<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Play Tom vs Jerry game. Guide Tom to catch Jerry, grow longer, and avoid obstacles.">
  <meta name="keywords" content="Tom vs Jerry game, HTML5 game, JavaScript game, arcade game">
  <meta name="author" content="Sandy">
  <title>Tom vs Jerry Game</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #2c3e50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      touch-action: none;
      overflow: hidden;
      color: #ecf0f1;
    }

    #gameContainer {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
    }

    canvas {
      background-image: url('https://iili.io/37jWioF.jpg');
      background-size: cover;
      display: block;
      border: 4px solid #3498db;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      width: 100%;
      height: auto;
      aspect-ratio: 1/1;
    }

    h1 {
      text-align: center;
      color: #ecf0f1;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    #scoreContainer {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      margin-bottom: 10px;
    }

    #score, #highScore {
      font-size: 20px;
      color: #ecf0f1;
      background-color: rgba(52, 73, 94, 0.7);
      padding: 8px 15px;
      border-radius: 5px;
    }

    #gameOverMessage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      color: #e74c3c;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      display: none;
      z-index: 10;
    }

    #startScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://freeimage.host/i/3YCYhu4');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    #startScreen h2 {
      color: #3498db;
      font-size: 32px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      background-color: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 10px;
    }

    #startScreen p {
      color: #ecf0f1;
      max-width: 80%;
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.5;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 15px;
      border-radius: 10px;
    }

    #difficultySelect {
      margin-bottom: 20px;
      padding: 8px;
      border-radius: 5px;
      background-color: #34495e;
      color: #ecf0f1;
      border: 2px solid #3498db;
    }

    #startButton {
      padding: 12px 30px;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-bottom: 10px;
    }

    #startButton:hover {
      background-color: #27ae60;
    }

    #mobileControls {
      display: none;
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto auto auto;
      gap: 10px;
    }

    .control-btn {
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 15px;
      font-size: 20px;
      text-align: center;
      touch-action: manipulation;
      user-select: none;
    }

    .control-btn:active {
      background-color: #2980b9;
    }

    #upBtn {
      grid-column: 2;
      grid-row: 1;
    }

    #leftBtn {
      grid-column: 1;
      grid-row: 2;
    }

    #rightBtn {
      grid-column: 3;
      grid-row: 2;
    }

    #downBtn {
      grid-column: 2;
      grid-row: 3;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      width: 100%;
      max-width: 400px;
      justify-content: center;
    }

    .action-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    #homeButton {
      background-color: #e67e22;
      color: white;
    }

    #homeButton:hover {
      background-color: #d35400;
    }

    #restartButton {
      background-color: #3498db;
      color: white;
    }

    #restartButton:hover {
      background-color: #2980b9;
    }

    #soundToggle {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.5);
      border: none;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      #mobileControls {
        display: grid;
      }
      
      #score, #highScore {
        font-size: 18px;
        padding: 6px 12px;
      }
      
      #gameOverMessage {
        font-size: 24px;
        padding: 15px;
      }

      .action-buttons {
        flex-direction: column;
        align-items: center;
      }

      .action-btn {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      #startScreen h2 {
        font-size: 26px;
      }
      
      #startScreen p {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <button id="soundToggle">🔊 Sound On</button>
  <h1>Tom vs Jerry</h1>
  
  <div id="scoreContainer">
    <div id="score">Score: 0</div>
    <div id="highScore">High Score: 0</div>
  </div>
  
  <div id="gameContainer">
    <canvas id="snakeGame" width="400" height="400" aria-label="Tom vs Jerry game canvas"></canvas>
    <div id="gameOverMessage" role="alert">Game Over!<br>Score: <span id="finalScore">0</span><br>
      <div class="action-buttons">
        <button id="homeButton" class="action-btn">Home</button>
        <button id="restartButton" class="action-btn">Restart</button>
      </div>
    </div>
    <div id="startScreen" role="dialog" aria-labelledby="gameTitle">
      <h2 id="gameTitle">Tom vs Jerry</h2>
      <p>Help Tom catch Jerry! Use arrow keys or on-screen buttons to control Tom. Avoid hitting the walls or yourself!</p>
      <select id="difficultySelect" aria-label="Select game difficulty">
        <option value="150">Easy</option>
        <option value="100" selected>Normal</option>
        <option value="70">Hard</option>
        <option value="50">Expert</option>
      </select>
      <button id="startButton" aria-label="Start game">Start Game</button>
    </div>
  </div>
  
  <div id="mobileControls">
    <button class="control-btn" id="upBtn" aria-label="Move up">↑</button>
    <button class="control-btn" id="leftBtn" aria-label="Move left">←</button>
    <button class="control-btn" id="rightBtn" aria-label="Move right">→</button>
    <button class="control-btn" id="downBtn" aria-label="Move down">↓</button>
  </div>

  <!-- Sound Effects -->
  <audio id="eatSound" preload="auto">
    <source src="https://jmp.sh/s/4Dt4kefz00eDD7WfqQ2U" type="audio/mpeg">
  </audio>
  <audio id="gameOverSound" preload="auto">
    <source src="https://jmp.sh/s/P4jPF5cARvM25qhmABmi" type="audio/mpeg">
  </audio>
  <audio id="moveSound" preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-quick-jump-arcade-game-239.mp3" type="audio/mpeg">
  </audio>
  <audio id="startSound" preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-game-show-suspense-waiting-668.mp3" type="audio/mpeg">
  </audio>
  <audio id="buttonSound" preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3" type="audio/mpeg">
  </audio>
  <audio id="backgroundMusic" loop preload="auto">
    <source src="https://assets.mixkit.co/music/preview/mixkit-game-show-suspense-waiting-668.mp3" type="audio/mpeg">
  </audio>

  <script>
    class TomJerryGame {
      constructor() {
        this.canvas = document.getElementById('snakeGame');
        this.ctx = this.canvas.getContext('2d');
        this.gridSize = 25; // Increased grid size for larger characters
        this.tom = [{ x: 175, y: 175 }]; // Adjusted starting position for new grid size
        this.jerry = { x: 100, y: 100 };
        this.dx = this.gridSize;
        this.dy = 0;
        this.score = 0;
        this.highScore = localStorage.getItem('tomJerryHighScore') || 0;
        this.gameOver = false;
        this.gameStarted = false;
        this.speed = 100;
        this.lastUpdateTime = 0;
        this.animationId = null;
        this.soundEnabled = true;
        
        // Load images
        this.tomHeadImg = new Image();
        this.tomHeadImg.src = 'https://iili.io/37jWsMg.png';
        this.tomBodyImg = new Image();
        this.tomBodyImg.src = 'https://iili.io/37jWsMg.png';
        this.jerryImg = new Image();
        this.jerryImg.src = 'https://iili.io/37jWLPa.png';
        
        // DOM elements
        this.scoreElement = document.getElementById('score');
        this.highScoreElement = document.getElementById('highScore');
        this.gameOverMessage = document.getElementById('gameOverMessage');
        this.finalScoreElement = document.getElementById('finalScore');
        this.startScreen = document.getElementById('startScreen');
        this.startButton = document.getElementById('startButton');
        this.difficultySelect = document.getElementById('difficultySelect');
        this.homeButton = document.getElementById('homeButton');
        this.restartButton = document.getElementById('restartButton');
        this.soundToggle = document.getElementById('soundToggle');
        
        // Mobile controls
        this.upBtn = document.getElementById('upBtn');
        this.leftBtn = document.getElementById('leftBtn');
        this.rightBtn = document.getElementById('rightBtn');
        this.downBtn = document.getElementById('downBtn');
        
        // Sound effects
        this.eatSound = document.getElementById('eatSound');
        this.gameOverSound = document.getElementById('gameOverSound');
        this.moveSound = document.getElementById('moveSound');
        this.startSound = document.getElementById('startSound');
        this.buttonSound = document.getElementById('buttonSound');
        this.backgroundMusic = document.getElementById('backgroundMusic');
        
        // Touch start coordinates
        this.touchStartX = 0;
        this.touchStartY = 0;
        
        this.init();
      }
      
      init() {
        // Set initial high score display
        this.highScoreElement.textContent = `High Score: ${this.highScore}`;
        
        // Event listeners
        window.addEventListener('keydown', (e) => this.handleKeyDown(e));
        this.startButton.addEventListener('click', () => {
          this.playSound(this.buttonSound);
          this.startGame();
        });
        this.homeButton.addEventListener('click', () => {
          this.playSound(this.buttonSound);
          this.goHome();
        });
        this.restartButton.addEventListener('click', () => {
          this.playSound(this.buttonSound);
          this.restartGame();
        });
        this.soundToggle.addEventListener('click', () => this.toggleSound());
        
        // Mobile control event listeners
        const mobileButtons = [this.upBtn, this.leftBtn, this.rightBtn, this.downBtn];
        mobileButtons.forEach(btn => {
          btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.playSound(this.moveSound);
            const direction = btn.id.replace('Btn', '');
            this.changeDirection(direction);
          });
          
          btn.addEventListener('click', () => {
            this.playSound(this.moveSound);
            const direction = btn.id.replace('Btn', '');
            this.changeDirection(direction);
          });
        });
        
        // Touch controls for swiping
        this.canvas.addEventListener('touchstart', (e) => {
          e.preventDefault();
          this.touchStartX = e.touches[0].clientX;
          this.touchStartY = e.touches[0].clientY;
        }, { passive: false });
        
        this.canvas.addEventListener('touchmove', (e) => {
          e.preventDefault();
          if (!this.touchStartX || !this.touchStartY) return;
          
          const touchEndX = e.touches[0].clientX;
          const touchEndY = e.touches[0].clientY;
          
          const dx = touchEndX - this.touchStartX;
          const dy = touchEndY - this.touchStartY;
          
          if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 0) this.changeDirection('right');
            else this.changeDirection('left');
          } else {
            if (dy > 0) this.changeDirection('down');
            else this.changeDirection('up');
          }
          
          this.touchStartX = 0;
          this.touchStartY = 0;
        }, { passive: false });
        
        // Generate initial jerry position
        this.generateJerry();
        
        // Draw initial state
        this.draw();
        
        // Start background music
        this.playBackgroundMusic();
      }
      
      toggleSound() {
        this.soundEnabled = !this.soundEnabled;
        this.soundToggle.textContent = this.soundEnabled ? "🔊 Sound On" : "🔇 Sound Off";
        
        if (this.soundEnabled) {
          this.playBackgroundMusic();
        } else {
          this.backgroundMusic.pause();
        }
      }
      
      playBackgroundMusic() {
        if (this.soundEnabled) {
          this.backgroundMusic.volume = 0.3;
          this.backgroundMusic.play().catch(e => console.log("Background music play failed:", e));
        }
      }
      
      startGame() {
        this.speed = parseInt(this.difficultySelect.value);
        this.startScreen.style.display = 'none';
        this.gameStarted = true;
        this.resetGame();
        this.lastUpdateTime = performance.now();
        this.gameLoop(this.lastUpdateTime);
        this.playSound(this.startSound);
      }
      
      resetGame() {
        this.tom = [{ x: 175, y: 175 }]; // Adjusted starting position for new grid size
        this.dx = this.gridSize;
        this.dy = 0;
        this.score = 0;
        this.scoreElement.textContent = `Score: ${this.score}`;
        this.gameOver = false;
        this.gameOverMessage.style.display = 'none';
        this.generateJerry();
      }
      
      goHome() {
        cancelAnimationFrame(this.animationId);
        this.gameOver = false;
        this.gameStarted = false;
        this.gameOverMessage.style.display = 'none';
        this.startScreen.style.display = 'flex';
        this.playBackgroundMusic();
      }
      
      draw() {
        // Clear canvas
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // Draw Tom (increased size by 30%)
        const tomSize = this.gridSize * 1.3;
        const tomOffset = (this.gridSize - tomSize) / 2;
        
        this.tom.forEach((part, index) => {
          if (index === 0) {
            // Draw head with rotation based on direction
            this.ctx.save();
            this.ctx.translate(part.x + this.gridSize/2, part.y + this.gridSize/2);
            
            let angle = 0;
            if (this.dx > 0) angle = 0; // right
            else if (this.dx < 0) angle = Math.PI; // left
            else if (this.dy > 0) angle = Math.PI/2; // down
            else if (this.dy < 0) angle = -Math.PI/2; // up
            
            this.ctx.rotate(angle);
            this.ctx.drawImage(
              this.tomHeadImg, 
              -tomSize/2, 
              -tomSize/2, 
              tomSize, 
              tomSize
            );
            this.ctx.restore();
          } else {
            // Draw body
            this.ctx.drawImage(
              this.tomBodyImg, 
              part.x + tomOffset, 
              part.y + tomOffset, 
              tomSize, 
              tomSize
            );
          }
        });
        
        // Draw Jerry (increased size by 25%)
        const jerrySize = this.gridSize * 1.25;
        const jerryOffset = (this.gridSize - jerrySize) / 2;
        this.ctx.drawImage(
          this.jerryImg, 
          this.jerry.x + jerryOffset, 
          this.jerry.y + jerryOffset, 
          jerrySize, 
          jerrySize
        );
      }
      
      gameLoop(timestamp) {
        if (this.gameOver) return;
        
        const deltaTime = timestamp - this.lastUpdateTime;
        
        if (deltaTime >= this.speed) {
          this.update();
          this.lastUpdateTime = timestamp - (deltaTime % this.speed);
        }
        
        this.animationId = requestAnimationFrame((ts) => this.gameLoop(ts));
      }
      
      update() {
        if (this.checkCollision()) {
          this.endGame();
          return;
        }
        
        this.moveTom();
        this.draw();
      }
      
      moveTom() {
        const head = { 
          x: this.tom[0].x + this.dx, 
          y: this.tom[0].y + this.dy 
        };
        
        this.tom.unshift(head);
        
        if (head.x === this.jerry.x && head.y === this.jerry.y) {
          this.score++;
          this.scoreElement.textContent = `Score: ${this.score}`;
          this.playSound(this.eatSound);
          this.generateJerry();
        } else {
          this.tom.pop();
        }
      }
      
      generateJerry() {
        let newJerryPosition;
        let positionValid;
        
        do {
          positionValid = true;
          newJerryPosition = {
            x: Math.floor(Math.random() * (this.canvas.width / this.gridSize)) * this.gridSize,
            y: Math.floor(Math.random() * (this.canvas.height / this.gridSize)) * this.gridSize
          };
          
          // Check if Jerry appears on Tom
          for (const segment of this.tom) {
            if (segment.x === newJerryPosition.x && segment.y === newJerryPosition.y) {
              positionValid = false;
              break;
            }
          }
        } while (!positionValid);
        
        this.jerry = newJerryPosition;
      }
      
      checkCollision() {
        const head = this.tom[0];
        
        // Wall collision
        if (
          head.x < 0 || 
          head.x >= this.canvas.width || 
          head.y < 0 || 
          head.y >= this.canvas.height
        ) {
          return true;
        }
        
        // Self collision
        for (let i = 1; i < this.tom.length; i++) {
          if (head.x === this.tom[i].x && head.y === this.tom[i].y) {
            return true;
          }
        }
        
        return false;
      }
      
      endGame() {
        this.gameOver = true;
        cancelAnimationFrame(this.animationId);
        
        if (this.score > this.highScore) {
          this.highScore = this.score;
          localStorage.setItem('tomJerryHighScore', this.highScore);
          this.highScoreElement.textContent = `High Score: ${this.highScore}`;
        }
        
        this.finalScoreElement.textContent = this.score;
        this.gameOverMessage.style.display = 'block';
        this.playSound(this.gameOverSound);
      }
      
      handleKeyDown(event) {
        if (!this.gameStarted && event.key === 'Enter') {
          this.playSound(this.buttonSound);
          this.startGame();
          return;
        }
        
        if (this.gameOver && (event.key === 'r' || event.key === 'R')) {
          this.playSound(this.buttonSound);
          this.restartGame();
          return;
        }
        
        switch (event.key) {
          case 'ArrowUp':
            this.playSound(this.moveSound);
            this.changeDirection('up');
            break;
          case 'ArrowDown':
            this.playSound(this.moveSound);
            this.changeDirection('down');
            break;
          case 'ArrowLeft':
            this.playSound(this.moveSound);
            this.changeDirection('left');
            break;
          case 'ArrowRight':
            this.playSound(this.moveSound);
            this.changeDirection('right');
            break;
        }
      }
      
      changeDirection(direction) {
        const goingUp = this.dy === -this.gridSize;
        const goingDown = this.dy === this.gridSize;
        const goingLeft = this.dx === -this.gridSize;
        const goingRight = this.dx === this.gridSize;
        
        switch (direction) {
          case 'up':
            if (!goingDown) {
              this.dx = 0;
              this.dy = -this.gridSize;
            }
            break;
          case 'down':
            if (!goingUp) {
              this.dx = 0;
              this.dy = this.gridSize;
            }
            break;
          case 'left':
            if (!goingRight) {
              this.dx = -this.gridSize;
              this.dy = 0;
            }
            break;
          case 'right':
            if (!goingLeft) {
              this.dx = this.gridSize;
              this.dy = 0;
            }
            break;
        }
      }
      
      restartGame() {
        this.resetGame();
        this.lastUpdateTime = performance.now();
        this.gameLoop(this.lastUpdateTime);
      }
      
      playSound(soundElement) {
        if (!this.soundEnabled) return;
        soundElement.currentTime = 0;
        soundElement.play().catch(e => console.log("Audio play failed:", e));
      }
    }

    // Initialize the game when the page loads
    document.addEventListener('DOMContentLoaded', () => {
      new TomJerryGame();
    });
  </script>
</body>
</html>
